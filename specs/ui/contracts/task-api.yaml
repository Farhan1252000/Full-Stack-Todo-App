# Task Management API Contract

## Overview
This document defines the API contract for task management operations in the Todo application.

## Base URL
`{{API_BASE_URL}}` (e.g., http://localhost:3001/api or https://api.todoapp.com/v1)

## Authentication
All endpoints require authentication using Bearer tokens passed in the Authorization header:
```
Authorization: Bearer {token}
```

## Common Headers
- `Content-Type: application/json`
- `Accept: application/json`

## API Endpoints

### Authentication

#### POST /auth/login
Authenticate user and return session token

**Request Body:**
```json
{
  "email": "user@example.com",
  "password": "securePassword123"
}
```

**Response (200 OK):**
```json
{
  "user": {
    "id": "user-uuid",
    "email": "user@example.com",
    "firstName": "John",
    "lastName": "Doe",
    "createdAt": "2023-01-01T00:00:00.000Z"
  },
  "token": "jwt-token-string"
}
```

**Response (401 Unauthorized):**
```json
{
  "error": "Invalid credentials"
}
```

#### POST /auth/register
Register a new user account

**Request Body:**
```json
{
  "firstName": "John",
  "lastName": "Doe",
  "email": "user@example.com",
  "password": "securePassword123"
}
```

**Response (201 Created):**
```json
{
  "user": {
    "id": "user-uuid",
    "email": "user@example.com",
    "firstName": "John",
    "lastName": "Doe",
    "createdAt": "2023-01-01T00:00:00.000Z"
  },
  "token": "jwt-token-string"
}
```

**Response (400 Bad Request):**
```json
{
  "error": "Email already exists"
}
```

### Tasks

#### GET /tasks
Retrieve all tasks for the authenticated user

**Query Parameters:**
- `status`: "all", "completed", "pending" (default: "all")
- `page`: page number for pagination (default: 1)
- `limit`: number of items per page (default: 20, max: 100)

**Response (200 OK):**
```json
{
  "tasks": [
    {
      "id": "task-uuid",
      "title": "Sample task",
      "description": "Task description",
      "completed": false,
      "createdAt": "2023-01-01T00:00:00.000Z",
      "updatedAt": "2023-01-01T00:00:00.000Z",
      "dueDate": "2023-01-10T00:00:00.000Z"
    }
  ],
  "pagination": {
    "page": 1,
    "limit": 20,
    "total": 1,
    "totalPages": 1
  }
}
```

#### POST /tasks
Create a new task

**Request Body:**
```json
{
  "title": "New task title",
  "description": "Task description",
  "dueDate": "2023-01-10T00:00:00.000Z"
}
```

**Response (201 Created):**
```json
{
  "task": {
    "id": "task-uuid",
    "title": "New task title",
    "description": "Task description",
    "completed": false,
    "createdAt": "2023-01-01T00:00:00.000Z",
    "updatedAt": "2023-01-01T00:00:00.000Z",
    "dueDate": "2023-01-10T00:00:00.000Z"
  }
}
```

**Response (400 Bad Request):**
```json
{
  "error": "Title is required"
}
```

#### PUT /tasks/{id}
Update an existing task

**Path Parameter:**
- `id`: Task ID

**Request Body:**
```json
{
  "title": "Updated task title",
  "description": "Updated task description",
  "completed": true,
  "dueDate": "2023-01-10T00:00:00.000Z"
}
```

**Response (200 OK):**
```json
{
  "task": {
    "id": "task-uuid",
    "title": "Updated task title",
    "description": "Updated task description",
    "completed": true,
    "createdAt": "2023-01-01T00:00:00.000Z",
    "updatedAt": "2023-01-02T00:00:00.000Z",
    "dueDate": "2023-01-10T00:00:00.000Z"
  }
}
```

#### PATCH /tasks/{id}/toggle-completion
Toggle the completion status of a task

**Path Parameter:**
- `id`: Task ID

**Response (200 OK):**
```json
{
  "task": {
    "id": "task-uuid",
    "title": "Task title",
    "description": "Task description",
    "completed": true,
    "createdAt": "2023-01-01T00:00:00.000Z",
    "updatedAt": "2023-01-02T00:00:00.000Z",
    "dueDate": "2023-01-10T00:00:00.000Z"
  }
}
```

#### DELETE /tasks/{id}
Delete a task

**Path Parameter:**
- `id`: Task ID

**Response (204 No Content)**